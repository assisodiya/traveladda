      <stop offset="55%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="14" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
